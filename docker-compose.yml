version: "3.8"

services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID:1
      - KAFKA_PROCESS_ROLES:broker,controller
      - KAFKA_LISTENERS:PLAINTEXT://broker:19092,CONTROLLER://broker:19093,PLAINTEXT_HOST://9092
      - KAFKA_ADVERTISED_LISTENERS:PLAINTEXT://broker:19092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS:1@broker:19093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES:CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:1

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=txuser
      - POSTGRES_PASSWORD=txpass
      - POSTGRES_DB=transactions
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: